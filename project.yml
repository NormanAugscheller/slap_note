name: SlapNote
options:
  bundleIdPrefix: com.normanaugscheller
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"

targets:
  SlapNoteCore:
    type: library.static
    platform: macOS
    sources:
      - path: SlapNoteCore
    settings:
      base:
        PRODUCT_NAME: SlapNoteCore
        SWIFT_INSTALL_OBJC_HEADER: NO
        SKIP_INSTALL: YES

  SlapNote:
    type: application
    platform: macOS
    sources:
      - path: SlapNote
    dependencies:
      - target: SlapNoteCore
      - package: KeyboardShortcuts
    info:
      path: SlapNote/Info.plist
      properties:
        CFBundleDisplayName: SlapNote
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normanaugscheller.SlapNote
        PRODUCT_NAME: SlapNote
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO

  SlapNoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SlapNoteTests
    dependencies:
      - target: SlapNoteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.normanaugscheller.SlapNoteTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SlapNote:
    build:
      targets:
        SlapNote: all
        SlapNoteCore: all
        SlapNoteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SlapNoteTests
    archive:
      config: Release
